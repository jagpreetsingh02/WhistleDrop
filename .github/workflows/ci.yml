name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    env:
      # Keep the MongoDB binary used by mongodb-memory-server outside
      # node_modules so it survives `npm ci` and can be cached between runs.
      # Absolute path: Node does not expand "~" in environment variables.
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test with coverage
        run: npm run test:coverage

  docker:
    name: Docker image & compose smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack, waiting for health checks
        env:
          JWT_SECRET: ci-only-secret-that-is-long-enough-for-validation-0123456789
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Exercise the running API
        run: |
          curl --fail --silent http://127.0.0.1:4000/health
          curl --fail --silent -X POST http://127.0.0.1:4000/api/v1/reports \
            -H 'Content-Type: application/json' \
            -d '{"category":"OTHER","description":"CI smoke test against the container image."}'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        env:
          JWT_SECRET: ci-only-secret-that-is-long-enough-for-validation-0123456789
        run: docker compose down -v
